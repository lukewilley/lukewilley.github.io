<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blaster Games</title>
    <link rel="icon" type="image/png" href="images/favicon.png">
    
    <style>
        /* Clean, retro-modern gaming aesthetic */
        :root {
            --bg-color: #ffffff;
            --card-bg: #96979b;
            --text-color: #000000;
            --accent-color: #cf2e2e; /* Soft blue */
            --action-color: #000000; /* Vibrant pink/red for CTA button */
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden; /* Prevents unwanted horizontal scroll crumbs */
        }

        /* --- HEADER & NAVIGATION --- */
        header {
            width: 100%;
            max-width: 1200px;     
            margin: 0 auto;        
            display: flex;
            justify-content: space-between; 
            align-items: center;   
            padding: 20px;
            box-sizing: border-box;
        }

        .logo {
            display: flex;
            align-items: center;
            font-weight: bold;
            font-size: 1.5rem;
            color: var(--accent-color);
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .logo-img {
            width: 80px; /* Scaled down slightly for better baseline harmony */
            height: 80px;
            object-fit: contain;   
            border-radius: 50%;
        }

        nav {
            display: flex;
            gap: 20px;
        }

        nav a {
            color: var(--text-color);
            text-decoration: none;
            font-weight: 500;
            transition: color 0.2s;
        }

        nav a:hover {
            color: var(--accent-color);
        }

        /* --- HERO PROMO SECTION --- */
        .hero-promo {
            width: 100%;
            min-height: 600px; 
            background-image: url('images/promo3.png'); 
            background-size: cover;
            background-position: bottom center;
            position: relative; 
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 60px 20px;
            box-sizing: border-box;
        }

        .hero-promo::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.4); 
            z-index: 1;
        }

        .hero-content {
            position: relative;
            z-index: 2; 
            color: #ffffff;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .hero-logo-container {
            width: 50%;         
            max-width: 600px;   
            margin-bottom: 200px; 
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }

        .hero-title-img {
            width: 100%;        
            height: auto;       
            display: block;
            filter: drop-shadow(0 8px 16px rgba(0, 0, 0, 0.7)); 
            
            -webkit-user-select: none; 
            -ms-user-select: none;     
            user-select: none;         
            -webkit-user-drag: none;
            -webkit-touch-callout: none;    
        }

        /* --- HERO BUTTONS --- */
        .hero-buttons {
            display: flex;
            justify-content: center;
            gap: 20px;
            width: 100%;
            position: relative;
            z-index: 3;
            margin-top: 10px;
        }

        .hero-buttons a {
            display: inline-block;
            padding: 14px 28px;
            font-size: 1.1rem;
            font-weight: bold;
            text-decoration: none;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-radius: 8px;
            transition: transform 0.2s ease, box-shadow 0.2s ease, background-color 0.2s ease;
            box-sizing: border-box;
        }

        .btn-steam {
            background: linear-gradient(180deg, #101d2a, #0b121a);
            color: #ffffff; 
            border: 2px solid #66c0f4;
            box-shadow: 0 4px 15px rgba(102, 192, 244, 0.2);
        }

        .btn-steam:hover {
            background: #5182b1;
            color: #ffffff;
            border-color: #66c0f4;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 192, 244, 0.4);
        }

        .btn-trailer {
            background-color: var(--action-color); 
            color: #ffffff;
            border: 2px solid #ffffff;
            box-shadow: 0 4px 15px rgba(244, 63, 94, 0.3);
        }

        .btn-trailer:hover {
            background-color: #e9335a; 
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(244, 63, 94, 0.5);
        }

        /* --- MAIN CONTENT & CONTAINERS --- */
        main {
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            box-sizing: border-box;
            text-align: center;
        }

        .gameplay-container {
            width: 100%;
            aspect-ratio: 16 / 9;
            background-color: var(--card-bg);
            border: 3px solid var(--text-color);
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 40px 0;
            box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.5);
            overflow: hidden;
        }

        .gameplay-placeholder {
            color: #ffffff;
            font-style: italic;
            padding: 10px;
        }

        .gameplay-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* --- FEATURES SECTION --- */
        .features {
            margin-top: 60px;
            text-align: left;
        }

        .features h2 {
            text-align: center;
            color: var(--accent-color);
            font-size: 2rem;
        }

        .feature-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }

        .feature-card {
            background-color: var(--card-bg);
            padding: 20px;
            border-radius: 8px;
            border-left: 4px solid var(--accent-color);
        }

        .feature-card h3 {
            margin-top: 0;
            font-size: 1.2rem;
        }

        .feature-card p {
            color: #ffffff;
            font-size: 0.95rem;
            line-height: 1.5;
            margin-bottom: 0;
        }

        footer {
            margin-top: 40px;
            padding: 20px;
            color: #000000;
            font-size: 0.85rem;
            text-align: center;
        }

        /* --- RESPONSIVE MEDIA QUERIES --- */
        @media (max-width: 768px) {
            header {
                flex-direction: column;
                gap: 15px;
                padding: 15px;
            }
            
            nav {
                margin-left: 0;
            }

            .hero-logo-container {
                width: 85%; /* Make title logo larger on small screens */
            }
        }

        @media (max-width: 600px) {
            .hero-buttons {
                flex-direction: column;
                align-items: center;
                gap: 12px;
            }
            .hero-buttons a {
                width: 100%;
                max-width: 300px;
            }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">
            <a href="index.html">
                <img src="images/blaster-games-logo.png" alt="Blaster Games Logo" class="logo-img">
            </a>
        </div>
        <nav>
            <a href="#">Home</a>
            <a href="#games">Games</a>
            <a href="#about">About</a>
        </nav>
    </header>
    
    <section class="hero-promo">
        <div class="hero-content">
            <div class="hero-logo-container">
                <img src="images/title.png" alt="Title Logo" class="hero-title-img">
            </div>
        </div>
        <div class="hero-buttons">
            <a href="https://store.steampowered.com" target="_blank" rel="noopener noreferrer" class="btn-steam">
                Wishlist on Steam
            </a>
            <a href="#gameplay-anchor" class="btn-trailer">
                Watch Trailer
            </a>
        </div>
    </section>
    
    <main id="gameplay-anchor">
        <div class="gameplay-container">
            <div class="gameplay-placeholder">Gameplay Trailer [COMING SOON]</div>
        </div>
    </main>

    <footer>
        &copy; 2026 Blaster Games
    </footer>

</body>
</html>
