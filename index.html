<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blaster Games</title>
    <link rel="icon" type="image/png" href="images/favicon.png">
    
    <style>
        /* Clean, retro-modern gaming aesthetic */
        :root {
            --bg-color: #ffffff;
            --card-bg: #96979b;
            --text-color: #000000;
            --accent-color: #cf2e2e; /* Soft blue */
            --action-color: #000000; /* Vibrant pink/red for CTA button */
        }
        .hero-promo {
            width: 100%;
            min-height: 600px; /* Adjust this height to fit your artwork */
            background-image: url('images/promo3.png'); /* Replace with your art filename */
            background-size: cover;
            background-position: center bottom;
            position: relative; /* Crucial: Keeps all the text/buttons locked inside this banner box */
            
            /* Center the contents inside the banner */
            display: inline-block;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 0px;
            box-sizing: border-box;
        }
        .hero-promo::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.4); /* Darkens the art by 40% */
            z-index: 1;
        }
        .hero-logo-container {
            width: 50%;         /* Forces the logo to be exactly 50% width of the promo area */
            max-width: 600px;   /* Prevents it from getting too small or too massive on extreme screens */
            padding: 90px 0px;
            margin-left: auto;  /* Combined with margin-right, this acts as a backup centering mechanism */
            margin-right: auto; 
            margin-bottom: 30px; /* Gives nice breathing room between the logo and the buttons below it */
            
            /* Keeps pixel art crisp if your logo image uses sprites */
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }

        .hero-title-img {
            width: 100%;        /* Forces the image to fill 100% of its 50%-wide container */
            height: auto;       /* Maintains the proper aspect ratio so it doesn't distort */
            display: block;
            filter: drop-shadow(0 8px 16px rgba(0, 0, 0, 1.7)); /* Makes the logo pop off the background */
            /* 1. PREVENTS THE USER FROM HIGHLIGHTING/SELECTING THE IMAGE */
            -webkit-user-select: none; /* Safari */
            -ms-user-select: none;     /* IE 10 and Edge */
            user-select: none;         /* Standard syntax for Chrome, Opera, Firefox */

            /* 2. PREVENTS THE USER FROM DRAGGING THE IMAGE */
            -webkit-user-drag: none;
            
            
            /* 3. DISABLES THE RIGHT-CLICK "SAVE IMAGE AS" GESTURE ON PHONES/TABLETS */
            -webkit-touch-callout: none;    
        }

        /* Forces the content layer to sit on top of the dark background mask */
        .hero-content {
            position: relative;
            z-index: 2; 
            color: #ffffff;
        }
        /* Container holding both buttons */
    .hero-buttons {
        display: flex;
        justify-content: center;
        gap: 20px;
        margin-bottom: -100px;
        padding: 100px 00px;
        width: 100%;
        position: relative;
        z-index: 3;
    }

    /* Base styling for both hero buttons */
    .hero-buttons a {
        display: inline-block;
        padding: 14px 28px;
        font-size: 1.1rem;
        font-weight: bold;
        text-decoration: none;
        text-transform: uppercase;
        letter-spacing: 1px;
        border-radius: 8px;
        transition: transform 0.2s ease, box-shadow 0.2s ease, background-color 0.2s ease;
    }

    /* Premium Steam Button Styles */
    .btn-steam {
        background: linear-gradient(180deg, #101d2a, #0b121a);
        color: #ffffff; /* Steam Blue */
        border: 2px solid #66c0f4;
        box-shadow: 0 4px 15px rgba(102, 192, 244, 0.2);
    }

    .btn-steam:hover {
        background: #5182b1;
        color: #ffffff;
        border-color: #66c0f4;
        transform: translateY(-2px);
        box-shadow: 0 6px 20px rgba(102, 192, 244, 0.4);
    }

    /* Premium Trailer Button Styles */
    .btn-trailer {
        background-color: var(--action-color); /* Your vibrant pink/red */
        color: #ffffff;
        border: 2px solid;
        box-shadow: 0 4px 15px rgba(244, 63, 94, 0.3);
    }

    .btn-trailer:hover {
        background-color: #e9335a; /* Slightly darker shade on hover */
        transform: translateY(-2px);
        box-shadow: 0 6px 20px rgba(244, 63, 94, 0.5);
    }

    /* Makes buttons scale nicely on mobile screens */
    @media (max-width: 600px) {
        .hero-buttons {
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }
        .hero-buttons a {
            width: 80%;
            max-width: 300px;
        }
    }
        .hero-content h1 {
            font-size: 3rem;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        /* The horizontal alignment box for your buttons */
        .hero-buttons {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 30px;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0px 0px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            width: 100%;
            max-width: 1200px;     /* Optional: Keeps it bounded on ultra-wide screens */
            margin: 0 auto;        
            display: flex;
            justify-content: space-between; /* Pushes logo to left, nav links to right */
            align-items: center;   /* FIX: Centers logo and nav links vertically relative to each other */
            padding: 20px 40px;    /* Adds clean breathing room around the header items */
            box-sizing: border-box;
        }

        .logo {
            display: flex;
            align-items: left;
            gap: 12px;
            font-weight: bold;
            font-size: 1.5rem;
            color: var(--accent-color);
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .logo-img {
            width: 100px;           /* Controls how big your logo icon looks */
            height: 100px;
            object-fit: contain;   /* Prevents the image from stretching weirdly */
            border-radius: 104px;
        }

        nav a {
            color: var(--text-color);
            text-decoration: none;
            margin-left: 20px;
            font-weight: 500;
            transition: color 0.2s;
        }

        nav a:hover {
            color: var(--accent-color);
        }

        main {
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
            padding: 0px 0px;
            box-sizing: border-box;
            text-align: center;
        }

        h1 {
            font-size: 3rem;
            margin-bottom: 10px;
            letter-spacing: -1px;
        }

        .tagline {
            font-size: 1.25rem;
            color: #ffffff;
            margin-bottom: 40px;
        }

        /* The Hero Media Placeholder */
        .gameplay-container {
            width: 100%;
            aspect-ratio: 16 / 9;
            background-color: var(--card-bg);
            border: 3px solid var(--text-color);
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: 40px;
            margin-bottom: 40px;
            /* padding: 50px 50px; */
            box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.5);
            overflow: hidden;
        }

        .gameplay-placeholder {
            color: #ffffff;
            font-style: italic;
        }

        .gameplay-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Features Section */
        .features {
            margin-top: 60px;
            text-align: left;
        }

        .features h2 {
            text-align: center;
            color: var(--accent-color);
            font-size: 2rem;
        }

        .feature-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }

        .feature-card {
            background-color: var(--card-bg);
            padding: 20px;
            border-radius: 8px;
            border-left: 4px solid var(--accent-color);
        }

        .feature-card h3 {
            margin-top: 0;
            font-size: 1.2rem;
        }

        .feature-card p {
            color: #ffffff;
            font-size: 0.95rem;
            line-height: 1.5;
            margin-bottom: 0;
        }

        footer {
            margin-top: 0px;
            padding: 0px;
            color: #000000;
            font-size: 0.85rem;
            align-self: center;
        }
        /* Container that forces the huge image to stay centered on the screen */
        .main-promo-image-container {
            width: 100%;
            min-height: 400px; /* Adjust this height to fit your artwork */
            background-image: url('promo2.png'); /* Replace with your art filename */
            background-size: cover;
            background-position: center;
            position: relative; /* Crucial: Keeps all the text/buttons locked inside this banner box */
            
            /* Center the contents inside the banner */
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 40px;
            box-sizing: border-box;
        }

    </style>
</head>
<body>
    <header>
        <div class="logo">
        <img src="images/blaster-games-logo.png" alt="Blaster Games Logo" class="logo-img">
    </div>
    <nav>
        <a href="#">Home</a>
        <a href="#games">Games</a>
        <a href="#about">About</a>
    </nav>
    </header>
    
    <section class="hero-promo">
        <div class="hero-content">
            
            <!-- THE GAME TITLE IMAGE (Floats on top of the background) -->
            <div class="hero-logo-container">
                <img src="images/title.png" alt="Title Logo" class="hero-title-img">
            </div>
            
            <!-- THE BUTTONS CONTAINER -->
            <!-- <div class="hero-buttons">
                <a href="#game-page" class="btn-main">Go To Game Page</a>
                <a href="#trailer" class="btn-secondary">Watch The Trailer</a>
            </div> -->
            
        </div>
        <div class="hero-buttons">
            <a href="https://store.steampowered.com" target="_blank" rel="noopener noreferrer" class="btn-steam">
                Wishlist on Steam
            </a>
            
            <a href="#gameplay-anchor" class="btn-trailer">
                Watch Trailer
            </a>
        </div>
    </section>
    

    <main>
        <div class="gameplay-container">
            <div class="gameplay-placeholder">Gameplay Trailer [COMING SOON]</div>
        </div>

        <!-- <button class="cta-btn" onclick="window.open('https://itch.io', '_blank')"></button> -->

    </main>

    <footer>
        &copy; 2026 Blaster Games
    </footer>

</body>
</html>
