<head>
  <meta charset="UTF-8">
  <title>Blaster Games</title>
  <!-- The leading slash / ensures it works from any folder level -->
  <link rel="stylesheet" href="/style.css"> 
</head>
    <header>
        <div class="logo">
            <a href="/">
                <img src="/images/blaster-games-logo.png" alt="Blaster Games Logo" class="logo-img">
            </a>
        </div>
        <nav>
            <a href="/">Home</a>
            <a href="/games/">Games</a>
        </nav>
    </header>

    <style>
                /* --- HEADER & NAVIGATION --- */
        header {
            width: 100%;
            max-width: 1500px;     
            margin: 0 auto;        
            display: flex;
            justify-content: flex-start; 
            align-items: center;   
            padding: 20px 40px;
            box-sizing: border-box;
            gap: 40px;
            border-bottom: 2px solid #c9c7c7; /* 1px light gray line */
            padding-bottom: 12px;
        }

        .logo {
            display: flex;
            align-items: center;
            font-weight: bold;
            font-size: 1.5rem;
            color: var(--accent-color);
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .logo-img {
            width: 80px; /* Scaled down slightly for better baseline harmony */
            height: 80px;
            object-fit: contain;   
            border-radius: 50%;
        }

        nav {
            display: flex;
            gap: 20px;
        }

        nav a {
            color: var(--text-color);
            text-decoration: none;
            font-weight: 500;
            transition: color 0.2s;
        }

        nav a:hover {
            color: var(--accent-color);
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: left;
            overflow-x: hidden; /* Prevents unwanted horizontal scroll crumbs */
        }
        /* --- RESPONSIVE MEDIA QUERIES --- */
        @media (max-width: 768px) {
            header {
                flex-direction: column;
                gap: 15px;
                padding: 15px;
            }
            
            nav {
                margin-left: 0;
            }
        }
        *, *::before, *::after {
            box-sizing: border-border; /* Forces padding to stay INSIDE element height */
            margin: 0;
            padding: 0;
        }
</style>
