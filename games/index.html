<style>
    /* Container for the grid */
.games-grid {
  display: grid;
  /* Automatically wraps items into a grid where each column fits ~462px */
  grid-template-columns: repeat(auto-fill, minmax(320px, 462px));
  gap: 24px;
  justify-content: center;
  padding: 20px;
}
/* Page Layout Wrapper */
/* Page Layout Wrapper */
.content-wrapper {
  padding-top: 48px;
  padding-bottom: 48px;
  width: 100%;
  box-sizing: border-box;
  display: flex;
  justify-content: center; /* Centers items horizontally on all screens */
}
/* Card Container */
.game-card {
  width: 90%;            /* Allows fluid shrinking on tiny screens */
  max-width: 300px;      /* Caps maximum size on larger displays */
  margin: 0 auto;        /* Fallback auto-margin alignment */
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 16px;
}

/* Image Anchor Container */
.game-capsule {
  width: 100%;
  aspect-ratio: 2 / 3;
  display: block;
 
  border-radius: 12px; /* Sharp, straight edges */
  overflow: hidden;
  box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
}

/* Cover Image */
.cover-image {
  width: 100%;
  height: 100%;
  object-fit: cover;
  border-radius: 2px; /* Ensures sharp edges on the image itself */
  display: block;
}

/* Platform Section */
.platform-bar {
  display: flex;
  justify-content: center;
  align-items: center;
  width: 100%;
  min-height: 36px; /* Prevents height collapse */
}

.platform-link {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 4px;
}

/* Steam Icon */
.steam-icon {
  width: 28px;
  height: 28px;
  fill: #171a21; /* Dark icon for light themes; change to #ffffff for dark themes */
  display: block;
  transition: transform 0.2s ease, opacity 0.2s ease;
}

.steam-icon:hover {
  transform: scale(1.1);
}

/* Ensure the body doesn't add unwanted outer scrollbars/offsets */
body {
  margin: 0;
  padding: 0;
  width: 100%;
}
@media (max-width: 768px) {
  .content-wrapper {
    padding-top: 24px;   /* Tighter top margin beneath header */
    padding-left: 16px;  /* Fits comfortably on smaller phone edges */
    padding-right: 16px;
    display: flex;
    justify-content: center; /* Centers the card on mobile screens */
  }

  .game-card {
    max-width: 280px; /* Slightly smaller display footprint for phones */
  }

  /* Increase tap target size for mobile fingers */
  .platform-link {
    padding: 12px; 
  }

  .steam-icon {
    width: 32px; /* Slightly larger icon so it's easy to tap */
    height: 32px;
  }
}

}
</style>
